[package]
name = "forgefox-vpn-ssh"
version = "1.0.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "forgefox_vpn_ssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri           = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-shell        = "2"
tauri-plugin-notification = "2"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
tokio           = { version = "1", features = ["full"] }
russh           = "0.44"
russh-keys      = "0.44"
anyhow          = "1"
uuid            = { version = "1", features = ["v4"] }
async-trait     = "0.1"
futures         = "0.3"
log             = "0.4"
env_logger      = "0.11"
once_cell       = "1"
parking_lot     = "0.12"
thiserror       = "1"
chrono          = { version = "0.4", features = ["serde"] }
urlencoding     = "2"
socket2         = "0.5"
dirs            = "5"
rand            = "0.8"
reqwest         = { version = "0.12", features = ["json"] }
base64          = "0.22"

[target.'cfg(windows)'.dependencies]
wintun          = "0.4"
windows-sys     = { version = "0.52", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_System_IO",
] }

# [profile.release] переехал в корневой Cargo.toml: в workspace профили
# нерутового пакета игнорируются, из-за чего lto и codegen-units=1 молча
# не применялись к релизной сборке.
