[package]
name = "rust-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5.0"
regex = "1.10.4"
base64 = "0.22.1"
rand = "0.8.5"
tokio = { version = "1.37.0", features = ["full"] }
russh = "0.42.0"
russh-keys = "0.42.0"
libc = "0.2"
futures = "0.3"
async-trait = "0.1"
socket2 = "0.5.5"
