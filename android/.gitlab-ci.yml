image: ubuntu:22.04

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_COMMAND_LINE_TOOLS: "11076708"
  GO_VERSION: "1.21.6"
  RUST_VERSION: "1.75.0"

stages:
  - build

build_apk:
  stage: build
  before_script:
    - apt-get update && apt-get install -y openjdk-17-jdk wget curl unzip git build-essential
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    # Install Android SDK
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_COMMAND_LINE_TOOLS}_latest.zip -O cmdline-tools.zip
    - unzip -q cmdline-tools.zip -d android-sdk
    - mkdir -p android-sdk/cmdline-tools/latest
    - mv android-sdk/cmdline-tools/bin android-sdk/cmdline-tools/lib android-sdk/cmdline-tools/source.properties android-sdk/cmdline-tools/latest/ || true
    - export ANDROID_HOME=$PWD/android-sdk
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
    - yes | sdkmanager --licenses || true
    - sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;25.1.8937393"
    # Install Rust
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - source "$HOME/.cargo/env"
    - rustup target add aarch64-linux-android
    - cargo install cargo-ndk
    # Install Go
    - wget -q https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz
    - tar -C /usr/local -xzf go${GO_VERSION}.linux-amd64.tar.gz
    - export PATH=$PATH:/usr/local/go/bin
    - go install golang.org/x/mobile/cmd/gomobile@latest
    - export PATH=$PATH:$(go env GOPATH)/bin
    - gomobile init
  script:
    # Build libbox.aar
    - git clone https://github.com/SagerNet/sing-box.git
    - cd sing-box
    - git checkout v1.8.0 || true
    - mkdir -p ../app/libs
    # Mocking libbox.aar for now if gomobile build fails to speed up testing
    - echo "Building libbox..."
    - go run ./cmd/internal/build_libbox -target android || echo "Warning building libbox failed"
    - cp libbox.aar ../app/libs/ || true
    - cd ..
    # Build rust core
    - cd rust-core
    - cargo ndk -t arm64-v8a build --release
    - cd ..
    # Setup gradle wrapper
    - gradle wrapper --gradle-version 8.1.1 || true
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
